<main class="login-page min-h-screen w-full bg-[#1b1a1a] flex flex-col items-center px-4 py-8 sm:pt-14">
  <button
    type="button"
    class="fixed left-5 top-4 z-10 flex h-10 w-10 items-center justify-center rounded bg-[#9c27b0] text-lg text-white shadow-[0_4px_12px_rgba(156,39,176,0.35)] transition-colors hover:bg-[#8a21a0] cursor-pointer"
    (click)="goBack()"
    aria-label="Volver"
  >
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <section class="login-group flex w-full max-w-[640px] flex-col items-center">
    <div
      class="mb-8 text-center text-[2.6rem] font-black leading-[0.95] tracking-widest text-[#9c27b0]  sm:text-[3.3rem]"
      style="font-family: 'Darklinos', Arial, sans-serif;"
    >
      Bling <br>&nbsp;&nbsp;Bling
    </div>

    <div class="login-card w-full rounded-[20px] bg-[#3c3c3c] px-8 py-9 shadow-[0_4px_24px_rgba(0,0,0,0.6),0_1.5px_12px_rgba(140,0,183,0.35)] sm:px-10">
      <h1 class="login-title text-white text-2xl font-bold text-center mb-7">{{ 'login.title' | translate }}</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group mb-6">
          <input
            id="usernameOrEmail"
            formControlName="usernameOrEmail"
            type="text"
            [placeholder]="'login.usernameOrEmail' | translate"
            class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
                   transition-colors focus:border-[#2196f3] focus:outline-none
                   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
          />
        </div>

        <div class="form-group mb-6">
          <input
            id="password"
            formControlName="password"
            type="password"
            [placeholder]="'login.password' | translate"
            autocomplete="current-password"
            class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
                   transition-colors focus:border-[#2196f3] focus:outline-none
                   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
          />
        </div>

        <div *ngIf="submittedAttempted && loginForm.invalid" class="mb-3 text-sm text-[#d32f2f] font-semibold" role="alert">
          {{ 'login.errors.required' | translate }}
        </div>

        <div class="mb-7">
          <label class="inline-flex items-center gap-3 text-white text-base font-semibold select-none">
            <input type="checkbox" formControlName="rememberMe" class="h-5 w-5 accent-[#9c27b0] cursor-pointer" />
            {{ 'login.rememberMe' | translate }}
          </label>
        </div>

        <div *ngIf="errorMessage" class="mb-3 text-sm text-[#d32f2f] font-semibold" role="alert">
          {{ errorMessage }}
        </div>

        <div class="login-buttons flex flex-col items-center gap-6 pt-1">
          <button
            type="submit"
            [disabled]="submitting"
            class="w-full max-w-[200px] px-4 py-3 text-white bg-[#9c27b0] border border-[#9c27b0] rounded text-base font-semibold
                   shadow-[0_2px_10px_rgba(156,39,176,0.4)] hover:bg-[#540761] transition-colors
                   disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer"
          >
            {{ submitting ? ('login.submitting' | translate) : ('login.submit' | translate) }}
          </button>

          <a routerLink="/register" class="login-forgot text-lg text-[#c000ff] hover:text-[#ffffff] transition-colors">
            {{ 'login.noAccount' | translate }}
          </a>
          <a routerLink="/forgot-password" class="login-forgot text-lg text-[#c000ff] hover:text-[#ffffff] transition-colors">
            {{ 'login.forgotPassword' | translate }}
          </a>
        </div>
      </form>
    </div>
  </section>
</main>
