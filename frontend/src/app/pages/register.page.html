<main class="register-page min-h-screen w-full bg-[#1b1a1a] flex items-center justify-center px-4 py-8">
  <section class="register-group w-full max-w-[520px]">
	<div
	  class="app-title text-[#9c27b0] text-[2rem] leading-tight font-bold tracking-widest mb-4"
	  style="font-family: 'Darklinos', Arial, sans-serif;"
	>
	  Bling <br />&nbsp;&nbsp;Bling
	</div>
j
	<div class="register-card w-full rounded-[10px] bg-[#3c3c3c] px-7 py-8 shadow-[0_4px_24px_rgba(0,0,0,0.6),0_1.5px_12px_rgba(140,0,183,0.35)]">
	  <h1 class="register-title text-white text-2xl font-bold text-center mb-6">{{ 'register.title' | translate }}</h1>

	  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
		<div class="form-group mb-3">
		  <input
			formControlName="username"
			type="text"
			[placeholder]="'register.username' | translate"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('username') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			formControlName="name"
			type="text"
			[placeholder]="'register.firstName' | translate"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('name') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			formControlName="surname"
			type="text"
			[placeholder]="'register.lastName' | translate"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('surname') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			id="password"
			formControlName="password"
			type="password"
			[placeholder]="'register.password' | translate"
			autocomplete="new-password"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('password') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			formControlName="passwordRepeat"
			type="password"
			[placeholder]="'register.passwordRepeat' | translate"
			autocomplete="new-password"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('passwordRepeat') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			formControlName="email"
			type="email"
			[placeholder]="'register.email' | translate"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('email') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div class="form-group mb-3">
		  <input
			formControlName="cellphone"
			type="text"
			[placeholder]="'register.phone' | translate"
			class="w-full px-4 py-3 border rounded-[8px] bg-transparent text-white text-base placeholder-[#aaa]
				   transition-colors focus:border-[#2196f3] focus:outline-none
				   focus:shadow-[0_0_0_0.2rem_rgba(33,150,243,0.25)]"
			[ngClass]="showError('cellphone') ? 'border-[#dc3545]' : 'border-[#ccc]'"
		  />
		</div>

		<div *ngIf="errorMessage" class="error mb-3 px-4 py-3 rounded bg-[#d32f2f] border border-[#b71c1c] text-white text-sm font-semibold" role="alert">
		  {{ errorMessage }}
		</div>

		<div class="register-buttons flex flex-col gap-3 pt-1">
		  <button
			type="submit"
			[disabled]="submitting"
			class="w-full px-4 py-3 text-white bg-[#9c27b0] border border-[#9c27b0] rounded text-base font-semibold
				   shadow-[0_2px_10px_rgba(156,39,176,0.4)] hover:bg-[#540761] transition-colors
				   disabled:opacity-60 disabled:cursor-not-allowed"
		  >
			{{ submitting ? ('register.submitting' | translate) : ('register.submit' | translate) }}
		  </button>
		  <a routerLink="/login" class="register-login text-sm text-[#d7b6ff] hover:text-[#ffffff] transition-colors">
			{{ 'register.hasAccount' | translate }}
		  </a>
		</div>
	  </form>
	</div>
  </section>
</main>
