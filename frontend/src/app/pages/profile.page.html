<div class="min-h-[calc(100vh-90px)] bg-[#1b1a1a] flex flex-col lg:flex-row">
  <aside class="w-full lg:w-[140px] xl:w-[180px] bg-[#222] text-white flex flex-col shrink-0 pt-0 lg:pt-10">
    <button type="button" class="bg-[#9c27b0] px-6 py-4 text-left font-bold text-lg leading-tight cursor-default">
      My Profile
    </button>
    <button type="button" class="px-6 py-6 text-left text-lg leading-tight cursor-default hover:bg-[#333] transition-colors">
      My Clubs
    </button>
    <button type="button" class="px-6 py-6 text-left text-lg leading-tight cursor-default hover:bg-[#333] transition-colors">
      Clubs Reservations
    </button>
    <button type="button" class="px-6 py-6 text-left text-lg leading-tight cursor-default hover:bg-[#333] transition-colors">
      My Reservations
    </button>
    <button type="button" class="px-6 py-6 text-left text-lg leading-tight cursor-default hover:bg-[#333] transition-colors">
      Reviews
    </button>

    <button type="button" class="mt-auto flex items-center gap-3 px-6 py-5 text-left text-lg hover:bg-[#333] transition-colors">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>
    </button>
  </aside>

  <section class="flex-1 min-w-0 px-4 sm:px-6 lg:px-6 py-5 lg:py-4 flex flex-col items-center relative">
    <button
      type="button"
      (click)="goBack()"
      aria-label="Go back to clubs"
      class="absolute top-4 lg:top-6 left-4 lg:left-3 w-12 h-8 lg:w-12 lg:h-10 rounded-md bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center cursor-pointer hover:scale-105 transition-transform"
    >
      <i class="fa-solid fa-arrow-left text-base lg:text-lg"></i>
    </button>

    <h1 class="mt-14 lg:mt-10 mb-8 lg:mb-10 text-center font-['Darklinos',Arial,sans-serif] text-[1.9rem] sm:text-[2.3rem] lg:text-[2.2rem] text-[#9c27b0] tracking-widest drop-shadow-[2px_2px_4px_rgba(216,0,183,0.28)] font-bold">
      USER PROFILE
    </h1>

    <div
      *ngIf="user as currentUser; else emptyUserState"
      class="w-full max-w-[560px] rounded-[22px] bg-[#3c3c3c] px-5 sm:px-8 lg:px-10 py-6 lg:py-8 shadow-[0_4px_24px_rgba(156,39,176,0.2)]"
    >
      <div class="grid gap-5">
        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">Username:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] break-words">{{ currentUser.username }}</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit username">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">First Name:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] break-words">{{ currentUser.name }}</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit first name">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">Last Name:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] break-words">{{ currentUser.surname }}</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit last name">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">Email:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] break-words">{{ currentUser.email }}</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit email">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">Phone:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] break-words">{{ currentUser.cellphone }}</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit phone">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <div class="grid grid-cols-[92px_minmax(0,1fr)_42px] sm:grid-cols-[140px_minmax(0,1fr)_44px] items-center gap-3 sm:gap-4">
          <span class="text-white font-bold text-[1.05rem] sm:text-[1.15rem] lg:text-[1.25rem]">Password:</span>
          <span class="text-white text-[1rem] sm:text-[1.1rem] lg:text-[1.15rem] tracking-[0.18em]">********</span>
          <button type="button" class="w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-[#9c27b0] to-[#d500f9] text-white shadow-[0_0_12px_rgba(156,39,176,0.6)] flex items-center justify-center text-base sm:text-lg" aria-label="Edit password">
            <i class="fa-solid fa-key"></i>
          </button>
        </div>
      </div>
    </div>

    <ng-template #emptyUserState>
      <div class="w-full max-w-[760px] rounded-[22px] bg-[#3c3c3c] px-6 py-6 text-white text-center shadow-[0_4px_24px_rgba(156,39,176,0.2)]">
        No profile data found. Please log in first.
      </div>
    </ng-template>
  </section>
</div>
