<div class="h-[calc(100vh-90px)] overflow-hidden bg-[#1b1a1a] text-white flex flex-col lg:flex-row lg:items-stretch">
  <app-side-bar [activeSection]="'clubsReservations'"></app-side-bar>

  <section class="flex-1 min-w-0 overflow-y-auto px-4 sm:px-6 py-5">
    <main class="mx-auto w-full max-w-[1180px] pb-10">
      <header class="mb-5 flex items-center gap-4">
        <a
          routerLink="/admin/activity"
          class="inline-flex h-10 w-10 items-center justify-center rounded-md bg-[#9c27b0] text-white transition hover:bg-[#86229a]"
          aria-label="Back"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div>
          <h1 class="text-[1.55rem] font-bold tracking-widest text-[#9c27b0]" style="font-family: 'Darklinos', Arial, sans-serif;">
            Clubs Reservations
          </h1>
          <p class="text-sm text-[#b9b9b9]">Review reservations across your clubs.</p>
        </div>
      </header>

      <section class="mb-5 rounded-lg border border-white/10 bg-[#343232] p-4 shadow-[0_4px_24px_rgba(0,0,0,0.35)]">
        <form class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-6" (ngSubmit)="applyFilters()">
          <select class="h-10 rounded-md border border-white/10 bg-[#242323] px-3 text-sm outline-none focus:border-[#9c27b0]" [(ngModel)]="filters.clubId" name="clubId">
            <option value="">Club</option>
            <option *ngFor="let club of clubs" [value]="club.clubId">{{ club.clubName }}</option>
          </select>

          <input class="h-10 rounded-md border border-white/10 bg-[#242323] px-3 text-sm outline-none focus:border-[#9c27b0]" type="date" [(ngModel)]="filters.bookingDate" name="bookingDate" />

          <select class="h-10 rounded-md border border-white/10 bg-[#242323] px-3 text-sm outline-none focus:border-[#9c27b0]" [(ngModel)]="filters.status" name="status">
            <option value="">Status</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADA">Confirmada</option>
            <option value="CANCELADA">Cancelada</option>
          </select>

          <select class="h-10 rounded-md border border-white/10 bg-[#242323] px-3 text-sm outline-none focus:border-[#9c27b0]" [(ngModel)]="filters.sort" name="sort">
            <option value="created_desc">Newest</option>
            <option value="created_asc">Oldest</option>
            <option value="start_desc">Date desc</option>
            <option value="start_asc">Date asc</option>
          </select>

          <select class="h-10 rounded-md border border-white/10 bg-[#242323] px-3 text-sm outline-none focus:border-[#9c27b0]" [(ngModel)]="filters.hasReceipt" name="hasReceipt">
            <option value="">Receipts</option>
            <option value="true">With receipt</option>
            <option value="false">Without receipt</option>
          </select>

          <button class="h-10 rounded-md bg-[#9c27b0] px-4 text-sm font-semibold transition hover:bg-[#86229a]" type="submit">
            <i class="fa-solid fa-filter mr-2"></i>Filter
          </button>
        </form>

        <button
          *ngIf="hasActiveFilters()"
          type="button"
          class="mt-3 h-10 rounded-md border border-white/10 bg-white/5 px-4 text-sm font-semibold transition hover:bg-white/10"
          (click)="resetFilters()"
        >
          <i class="fa-solid fa-rotate-right mr-2"></i>Reset
        </button>
      </section>

      <p *ngIf="error" class="mb-4 rounded-md border border-rose-500/30 bg-rose-950/50 px-4 py-3 text-rose-100">{{ error }}</p>

      <section class="space-y-4">
        <button
          *ngFor="let booking of bookings"
          type="button"
          class="block w-full rounded-lg border border-white/10 bg-[#343232] p-5 text-left shadow-[0_4px_24px_rgba(0,0,0,0.35)] transition hover:-translate-y-0.5 hover:border-[#9c27b0]/60 hover:bg-[#3b3838]"
          (click)="goToBooking(booking)"
        >
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div class="min-w-0 space-y-2">
              <p class="break-all text-sm text-white/70"><span class="font-semibold text-white">Reserva:</span> {{ bookingCode(booking) }}</p>
              <p class="text-sm text-white/70"><span class="font-semibold text-white">Club:</span> {{ clubNames[booking.clubId] || booking.clubId }}</p>
              <p class="text-sm text-white/70"><span class="font-semibold text-white">Date:</span> {{ formatDate(booking.bookingStart) }}</p>
              <p class="text-sm text-white/70"><span class="font-semibold text-white">Total:</span> $ {{ booking.totalAmount || 0 }}</p>
            </div>

            <span class="shrink-0 rounded-full border px-3 py-1 text-sm font-semibold" [ngClass]="statusClasses(booking.status)">
              {{ statusLabel(booking.status) }}
            </span>
          </div>
        </button>

        <div *ngIf="!loading && bookings.length === 0" class="rounded-lg border border-white/10 bg-[#343232] p-8 text-center text-white/60">
          No reservations found.
        </div>
      </section>

      <nav *ngIf="totalPages > 1" class="mt-8 flex items-center justify-center gap-4">
        <button class="h-10 w-10 rounded-full bg-[#2a2a2a] transition hover:bg-purple-700 disabled:opacity-30" [disabled]="currentPage === 1" (click)="prevPage()">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-sm text-[#bab8b8]">{{ currentPage }} de {{ totalPages }}</span>
        <button class="h-10 w-10 rounded-full bg-[#2a2a2a] transition hover:bg-purple-700 disabled:opacity-30" [disabled]="currentPage === totalPages" (click)="nextPage()">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </nav>
    </main>
  </section>
</div>
