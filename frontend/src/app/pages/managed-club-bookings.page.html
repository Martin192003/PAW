<div class="h-[calc(100vh-90px)] overflow-hidden bg-[#1b1a1a] text-white flex flex-col lg:flex-row lg:items-stretch">
  <app-side-bar [activeSection]="'clubsReservations'"></app-side-bar>

  <section class="flex-1 min-w-0 overflow-y-auto px-4 sm:px-6 py-5">
    <main class="mx-auto w-full max-w-[1180px] pb-10">
      <header class="mb-5 flex items-center gap-4">
        <a
          routerLink="/admin/activity"
          class="inline-flex h-10 w-10 items-center justify-center rounded-md bg-[#9c27b0] text-white transition hover:bg-[#86229a]"
          [attr.aria-label]="'managedClubBookings.back' | translate"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div>
          <h1 class="text-[1.55rem] font-bold tracking-widest text-[#9c27b0]" style="font-family: 'Darklinos', Arial, sans-serif;">
            {{ 'managedClubBookings.title' | translate }}
          </h1>
          <p class="text-sm text-[#b9b9b9]">{{ 'managedClubBookings.subtitle' | translate }}</p>
        </div>
      </header>

      <section class="mb-5">
        <div class="flex w-full items-center justify-center gap-3">
          <form
            class="flex w-fit max-w-full flex-wrap items-stretch overflow-hidden rounded-lg bg-[#3c3c3c] shadow-[0_2px_6px_rgba(0,0,0,0.15)] xl:flex-nowrap"
            (ngSubmit)="applyFilters()"
          >
             <select class="h-12 w-[160px] bg-transparent px-3 text-sm text-white outline-none" [(ngModel)]="filters.clubId" name="clubId">
               <option value="" class="text-black">{{ 'managedClubBookings.filters.club' | translate }}</option>
               <option *ngFor="let club of clubs" [value]="club.clubId" class="text-black">{{ club.clubName }}</option>
             </select>

             <input class="h-12 w-[190px] bg-transparent px-3 text-sm text-white outline-none" type="date" [(ngModel)]="filters.bookingDate" name="bookingDate" />

             <select class="h-12 w-[150px] bg-transparent px-3 text-sm text-white outline-none" [(ngModel)]="filters.status" name="status">
               <option value="" class="text-black">{{ 'managedClubBookings.filters.status' | translate }}</option>
               <option value="PENDIENTE" class="text-black">{{ 'managedClubBookings.statuses.PENDIENTE' | translate }}</option>
               <option value="CONFIRMADA" class="text-black">{{ 'managedClubBookings.statuses.CONFIRMADA' | translate }}</option>
               <option value="CANCELADA" class="text-black">{{ 'managedClubBookings.statuses.CANCELADA' | translate }}</option>
             </select>

             <select class="h-12 w-[145px] bg-transparent px-3 text-sm text-white outline-none" [(ngModel)]="filters.sort" name="sort">
               <option value="" class="text-black">{{ 'managedClubBookings.filters.sort' | translate }}</option>
               <option value="created_desc" class="text-black">{{ 'managedClubBookings.filters.newest' | translate }}</option>
               <option value="created_asc" class="text-black">{{ 'managedClubBookings.filters.oldest' | translate }}</option>
               <option value="start_desc" class="text-black">{{ 'managedClubBookings.filters.dateDesc' | translate }}</option>
               <option value="start_asc" class="text-black">{{ 'managedClubBookings.filters.dateAsc' | translate }}</option>
             </select>

             <select class="h-12 w-[160px] bg-transparent px-3 text-sm text-white outline-none" [(ngModel)]="filters.hasReceipt" name="hasReceipt">
               <option value="" class="text-black">{{ 'managedClubBookings.filters.receipts' | translate }}</option>
               <option value="true" class="text-black">{{ 'managedClubBookings.filters.withReceipt' | translate }}</option>
               <option value="false" class="text-black">{{ 'managedClubBookings.filters.withoutReceipt' | translate }}</option>
             </select>

             <button class="h-12 shrink-0 bg-[#9c27b0] px-7 font-semibold text-white transition hover:bg-[#8a21a0]" type="submit">
               <i class="fa-solid fa-filter mr-1"></i>{{ 'managedClubBookings.buttons.filter' | translate }}
             </button>
          </form>

           <button
             *ngIf="hasActiveFilters()"
             type="button"
             class="h-12 shrink-0 whitespace-nowrap border-0 bg-transparent px-1 text-sm text-[#9c27b0] transition hover:text-[#540761]"
             (click)="resetFilters()"
           >
             <i class="fa-solid fa-rotate-right mr-1"></i>{{ 'managedClubBookings.buttons.reset' | translate }}
           </button>
        </div>
      </section>

      <p *ngIf="error" class="mb-4 rounded-md border border-rose-500/30 bg-rose-950/50 px-4 py-3 text-rose-100">{{ error }}</p>

      <section class="space-y-4">
        <button
          *ngFor="let booking of bookings"
          type="button"
          class="block w-full rounded-lg border border-white/10 bg-[#343232] p-5 text-left shadow-[0_4px_24px_rgba(0,0,0,0.35)] transition hover:-translate-y-0.5 hover:border-[#9c27b0]/60 hover:bg-[#3b3838]"
          (click)="goToBooking(booking)"
        >
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
           <div class="min-w-0 space-y-2">
               <p class="break-all text-sm text-white/70"><span class="font-semibold text-white">{{ 'managedClubBookings.bookingCard.reserva' | translate }}</span> {{ bookingCode(booking) }}</p>
               <p class="text-sm text-white/70"><span class="font-semibold text-white">{{ 'managedClubBookings.bookingCard.club' | translate }}</span> {{ clubNames[booking.clubId] || booking.clubId }}</p>
               <p class="text-sm text-white/70"><span class="font-semibold text-white">{{ 'managedClubBookings.bookingCard.date' | translate }}</span> {{ formatDate(booking.bookingStart) }}</p>
               <p class="text-sm text-white/70"><span class="font-semibold text-white">{{ 'managedClubBookings.bookingCard.total' | translate }}</span> $ {{ booking.totalAmount || 0 }}</p>
             </div>

            <span class="shrink-0 rounded-full border px-3 py-1 text-sm font-semibold" [ngClass]="statusClasses(booking.status)">
              {{ ('managedClubBookings.statuses.' + booking.status) | translate }}
            </span>
          </div>
        </button>

         <div *ngIf="!loading && bookings.length === 0" class="rounded-lg border border-white/10 bg-[#343232] p-8 text-center text-white/60">
           {{ 'managedClubBookings.noReservations' | translate }}
         </div>
      </section>

       <nav *ngIf="totalPages > 1" class="mt-8 flex items-center justify-center gap-4">
         <button class="h-10 w-10 rounded-full bg-[#2a2a2a] transition hover:bg-purple-700 disabled:opacity-30" [disabled]="currentPage === 1" (click)="prevPage()" [attr.aria-label]="'managedClubBookings.previousPage' | translate">
           <i class="fa-solid fa-chevron-left"></i>
         </button>
         <span class="text-sm text-[#bab8b8]">{{ currentPage }} {{ 'common.of' | translate }} {{ totalPages }}</span>
         <button class="h-10 w-10 rounded-full bg-[#2a2a2a] transition hover:bg-purple-700 disabled:opacity-30" [disabled]="currentPage === totalPages" (click)="nextPage()" [attr.aria-label]="'managedClubBookings.nextPage' | translate">
           <i class="fa-solid fa-chevron-right"></i>
         </button>
       </nav>
    </main>
  </section>
</div>
