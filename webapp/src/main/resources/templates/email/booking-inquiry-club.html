<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #0d0f15;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #a64ca6;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p, li {
            color: #e6e6e6;
            margin: 10px 0;
            font-size: 16px;
        }

        b {
            color: #ffffff;
            font-weight: 600;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 10px;
            background-color: #333333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .contact-info {
            background: #2c2c2c;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }

        .message-section {
            background: #2c2c2c;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            font-style: italic;
            color: #ffffff;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            margin-top: 30px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }

        .tag {
            display: inline-block;
            background: #a64ca6;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: .6px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .divider {
            height: 1px;
            background: #444;
            margin: 24px 0;
            border: none;
        }
    </style>
</head>
<body>
<div class="email-container">
    <h2 th:text="#{email.booking.club.title(${clubName})}"></h2>

    <div class="contact-info">
        <p><b th:text="#{email.booking.club.name(${name})}"></b></p>
        <p><b th:text="#{email.booking.club.email(${fromEmail})}"></b></p>
        <p><b th:text="#{email.booking.club.phone(${phone})}"></b></p>
    </div>

    <p><b th:text="#{email.booking.club.message}"></b></p>
    <div class="message-section">
        [[${message}]]
    </div>

    <div class="footer">
        <p th:text="#{email.booking.club.sent(${submittedAt})}"></p>
    </div>
</div>
</body>
</html>
