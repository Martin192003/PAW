<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="email-styles.css">
</head>
<body>
<div class="email-container">
    <h2>Consulta para [[${clubName}]]</h2>
    <p><b>Nombre:</b> [[${name}]]</p>
    <p><b>Email:</b> [[${fromEmail}]]</p>
    <p><b>Teléfono:</b> [[${phone}]]</p>
    <p><b>Mensaje:</b><br>[[${message}]]</p>
    <p style="margin-top:16px;">
        <a th:href="${ctaUrl}" class="button">[[${ctaText}]]</a>
    </p>
    <p class="footer">Enviado: [[${submittedAt}]]</p>
</div>
</body>
</html>
