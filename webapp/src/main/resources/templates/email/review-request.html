<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.review.request.title}">Solicitar reseña</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #2c2c2c;
            margin: 0;
            padding: 0;
        }
        h2 {
            color: #a64ca6;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p, li {
            color: #e6e6e6;
            margin: 10px 0;
            font-size: 16px;
        }
        a.button {
            display: inline-block;
            background-color: #a64ca6;
            color: #ffffff !important;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 16px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #922d92;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #333333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        .divider {
            height: 1px;
            background: #444;
            margin: 24px 0;
            border: none;
        }
        b {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="email-container">
    <img src="https://i.postimg.cc/G2fXVYJD/icon-PAW.png"
         alt="Header Image"
         style="width:50%;height:auto;max-width:600px;display:block;margin-bottom:24px;margin-left:auto;margin-right:auto;">
    <h2 th:text="#{email.review.request.heading(${clubName})}">¡Queremos tu opinión!</h2>
    <p th:text="#{email.review.request.body(${username}, ${clubName}, ${date})}">
        Hola, nos gustaría saber cómo fue tu experiencia en el club.
    </p>
    <p th:text="#{email.review.request.instructions}">
        Haz clic en el siguiente botón para dejar tu reseña.
    </p>
    <p style="text-align: center;">
        <a th:href="${ctaUrl}" class="button" th:text="#{email.review.request.cta}">Dejar reseña</a>
    </p>
    <hr class="divider"/>
    <div class="footer">
        <span th:text="${brandName}">BlingBling</span> —
        <span th:text="${brandFooter}">© 2025 BlingBling.</span>
    </div>
</div>
</body>
</html>
