<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Club Creation Confirmation</title>
</head>
<body>
<h1>Club Created Successfully!</h1>
<p>Dear user,</p>
<p>We are excited to inform you that your club "<strong th:text="${clubName}"></strong>" has been successfully created.</p>
<p>Creation Date: <span th:text="${#temporals.format(createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
<p>Thank you for using our platform!</p>
<p>Best regards,</p>
<p>The Team</p>
</body>
</html>
