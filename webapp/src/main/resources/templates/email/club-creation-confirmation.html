<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #ffffff; /* White */
            background-color: #2c2c2c; /* Dark gray */
            margin: 0;
            padding: 0;
        }

        h2, h1 {
            color: #a64ca6; /* Violet */
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p, li {
            color: #e6e6e6; /* Soft white */
            margin: 10px 0;
            font-size: 16px;
        }

        a {
            color: #ffffff; /* White */
            text-decoration: none;
        }

        a.button {
            display: inline-block;
            background-color: #a64ca6; /* Violet */
            color: #ffffff; /* White */
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 16px;
            transition: background-color 0.3s ease;
        }

        a.button:hover {
            background-color: #922d92; /* Darker violet */
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #444; /* Darker gray */
            border-radius: 8px;
            background-color: #333333; /* Intermediate gray */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999; /* Light gray */
            margin-top: 20px;
            border-top: 1px solid #444; /* Separator line */
            padding-top: 10px;
        }
    </style>
    <meta charset="UTF-8">
    <title th:text="#{email.club.creation.title}"></title>
</head>
<body>
<div class="email-container">
    <img src="https://i.imgur.com/ajYTlyp.png"
         alt="Header Image"
         style="width:50%;height:50%;max-width:600px;display:block;margin-bottom:24px;margin-left:auto;margin-right:auto;">
    <h2 th:text="#{email.club.creation.heading}"></h2>
    <p th:text="#{email.club.creation.greeting}"></p>
    <p th:text="#{email.club.creation.body(${clubName})}"></p>
    <p th:text="#{email.club.creation.date(${#temporals.format(createdAt, 'dd/MM/yyyy HH:mm')})}"></p>
    <p th:text="#{email.club.creation.thankyou}"></p>
    <p style="text-align:center;margin:28px 0 6px;">
        <a th:href="${ctaUrl}"
           style="display:inline-block;padding:12px 20px;background:#9c27b0;color:#fff;text-decoration:none;border-radius:8px"
           th:text="#{email.club.creation.manage.button}"></a>
    </p>
    <p th:text="#{email.club.creation.signature}"></p>
    <div class="footer">
        <p th:text="#{email.club.creation.footer}"></p>
    </div></div>
</body>
</html>
