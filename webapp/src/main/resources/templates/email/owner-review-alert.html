<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.review.owner.title(${clubName})}">Nueva resena</title>
</head>
<body style="margin:0;padding:0;background:#1a1a1f;font-family:'Helvetica Neue',Arial,sans-serif;color:#e6e6e6;line-height:1.6;">
<div style="background:#1a1a1f;padding:32px 16px;">
    <div style="max-width:560px;margin:0 auto;background:#262630;border:1px solid #3a3a45;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.35);padding:36px 32px;">

        <img src="https://i.imgur.com/ajYTlyp.png"
             alt="BlingBling"
             style="display:block;margin:0 auto 24px;max-width:280px;width:60%;height:auto;"/>

        <h2 style="color:#c97cd3;text-align:center;font-size:22px;font-weight:600;margin:0 0 8px;"
            th:text="#{email.review.owner.title(${clubName})}">Nueva resena</h2>
        <p style="text-align:center;color:#9a9aa6;font-size:13px;margin:0 0 28px;">Tu club recibio un nuevo comentario</p>

        <div style="background:#1f1f27;border:1px solid #3a3a45;border-radius:8px;padding:18px 20px;margin:0 0 16px;">
            <p style="margin:0 0 8px;font-size:14px;">
                <span style="color:#9a9aa6;">Por</span> &nbsp;
                <span style="color:#ffffff;font-weight:600;" th:text="${reviewer}">Usuario</span>
                <span style="display:inline-block;background:#1a1a1f;border:1px solid #3a3a45;border-radius:14px;padding:3px 10px;margin-left:8px;color:#ffd166;font-weight:600;font-size:13px;">
                    <span th:text="${rating}">5</span> &#9733;
                </span>
            </p>
            <p th:if="${fromTableGuest}" style="display:inline-block;margin:6px 0 0;background:#a64ca6;color:#ffffff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:14px;letter-spacing:0.6px;text-transform:uppercase;" th:text="#{email.review.owner.badge}">Reservo mesa</p>
        </div>

        <p style="margin:0 0 8px;font-size:13px;color:#9a9aa6;text-transform:uppercase;letter-spacing:0.5px;" th:text="#{email.review.owner.comment}">Comentario</p>
        <div style="background:#1f1f27;border:1px solid #3a3a45;border-radius:8px;padding:18px 20px;margin:0 0 16px;color:#ffffff;white-space:pre-wrap;" th:text="${description}">Excelente musica y ambiente.</div>

        <div th:if="${photoUrl}" style="text-align:center;margin:0 0 24px;">
            <img th:src="${photoUrl}" alt="Foto de resena" style="max-width:200px;border-radius:8px;border:1px solid #3a3a45;"/>
        </div>

        <p style="text-align:center;margin:28px 0;">
            <a th:href="${ctaUrl}"
               style="display:inline-block;background:#a64ca6;color:#ffffff;padding:13px 28px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;"
               th:text="${ctaText}">Abrir resenas</a>
        </p>

        <hr style="border:none;height:1px;background:#3a3a45;margin:28px 0 18px;"/>

        <p style="text-align:center;font-size:12px;color:#6f6f78;margin:0;">
            <span th:text="${brandName}">BlingBling</span> &mdash;
            <span th:text="${brandFooter}">&copy; 2025 BlingBling</span>
        </p>
    </div>
</div>
</body>
</html>
