<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.password.reset.title}"></title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #2c2c2c;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #333333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #a64ca6;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .content {
            padding: 20px 0;
            color: #e6e6e6;
        }
        .content p {
            color: #e6e6e6;
            margin: 10px 0;
            font-size: 16px;
        }
        .cta-button {
            display: inline-block;
            background-color: #a64ca6;
            color: #ffffff;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .cta-button:hover {
            background-color: #922d92;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        .warning {
            background-color: #4a4a4a;
            border: 1px solid #666;
            color: #ffcc00;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }
        .warning strong {
            color: #ffcc00;
        }
        .warning ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .warning li {
            color: #e6e6e6;
            margin: 5px 0;
        }
        .url-box {
            word-break: break-all;
            background-color: #4a4a4a;
            color: #e6e6e6;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 th:text="#{email.password.reset.title}"></h1>
    </div>

    <div class="content">
        <p th:text="#{email.password.reset.greeting(${username})}"></p>

        <p th:text="#{email.password.reset.message}">
        </p>

        <div style="text-align: center;">
            <a th:href="@{${resetUrl}(token=${token})}"
               class="cta-button"
               th:text="#{email.password.reset.button}">
            </a>
        </div>

        <div class="warning">
            <p><strong th:text="#{email.important}"></strong></p>
            <ul>
                <li th:text="#{email.password.reset.warning}"></li>
                <li th:text="#{email.password.reset.expiry}">
                </li>
            </ul>
        </div>

        <p th:text="#{email.link.problems}"></p>
        <div class="url-box">
            <span th:text="${resetUrl + '?token=' + token}"></span>
        </div>
    </div>

    <div class="footer">
        <p th:text="#{email.password.reset.footer(#{app.title})}">
        </p>
        <p>
            <span th:text="#{email.sent.at}"></span>:
            <span th:text="${#temporals.format(requestedAt, 'dd/MM/yyyy HH:mm')}"></span>
        </p>
        <p th:text="#{email.auto.sent}"></p>
    </div>
</div>
</body>
</html>
