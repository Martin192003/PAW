<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{email.registration.title}">Verificar cuenta</title>
</head>
<body style="margin:0;padding:0;background:#1a1a1f;font-family:'Helvetica Neue',Arial,sans-serif;color:#e6e6e6;line-height:1.6;">
<div style="background:#1a1a1f;padding:32px 16px;">
    <div style="max-width:560px;margin:0 auto;background:#262630;border:1px solid #3a3a45;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.35);padding:36px 32px;">

        <img src="https://i.imgur.com/ajYTlyp.png"
             alt="BlingBling"
             style="display:block;margin:0 auto 24px;max-width:280px;width:60%;height:auto;"/>

        <h2 style="color:#c97cd3;text-align:center;font-size:22px;font-weight:600;margin:0 0 8px;"
            th:text="#{email.registration.title}">Bienvenido</h2>
        <p style="text-align:center;color:#9a9aa6;font-size:13px;margin:0 0 28px;" th:text="#{email.registration.verify.text}">Verifica tu cuenta</p>

        <p style="font-size:15px;margin:0 0 16px;" th:text="#{email.registration.greeting(${username})}">Hola usuario,</p>

        <p style="font-size:15px;margin:0 0 16px;" th:text="#{email.registration.body}"></p>

        <p style="font-size:15px;margin:0 0 16px;" th:text="#{email.registration.instructions}"></p>

        <p style="text-align:center;margin:28px 0;">
            <a th:href="${verificationUrl}"
               style="display:inline-block;background:#a64ca6;color:#ffffff;padding:13px 28px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;"
               th:text="#{email.registration.button}">Verificar cuenta</a>
        </p>

        <p style="font-size:13px;color:#9a9aa6;text-align:center;margin:0;" th:text="#{email.registration.expiry}"></p>

        <hr style="border:none;height:1px;background:#3a3a45;margin:28px 0 18px;"/>

        <p style="text-align:center;font-size:12px;color:#6f6f78;margin:0;" th:text="#{email.registration.disclaimer}"></p>
        <p style="text-align:center;font-size:12px;color:#6f6f78;margin:8px 0 0;" th:text="#{email.registration.footer}">&copy; 2025 BlingBling</p>
    </div>
</div>
</body>
</html>
