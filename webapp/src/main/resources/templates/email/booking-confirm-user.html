<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.booking.confirmed.user.title}">Reserva confirmada</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #2c2c2c;
            margin: 0;
            padding: 0;
        }
        h2, h1 {
            color: #a64ca6;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p, li {
            color: #e6e6e6;
            margin: 10px 0;
            font-size: 16px;
        }
        b { color: #ffffff; font-weight: 600; }
        a { color: #ffffff; text-decoration: none; }
        a.button {
            display: inline-block;
            background-color: #a64ca6;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-top: 16px;
            transition: background-color 0.3s ease;
        }
        a.button:hover { background-color: #922d92; }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #333333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .reservation-info {
            background: #2c2c2c;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
        .divider {
            height: 1px;
            background: #444;
            margin: 24px 0;
            border: none;
        }
    </style>
</head>
<body>
<div class="email-container">
    <img src="https://i.postimg.cc/G2fXVYJD/icon-PAW.png"
         alt="Header Image"
         style="width:50%;height:50%;max-width:600px;display:block;margin-bottom:24px;margin-left:auto;margin-right:auto;">
    <h2 th:text="#{email.booking.confirmed.user.heading}">¡Tu reserva fue confirmada!</h2>
    <p th:text="#{email.booking.confirmed.user.body(${clubName})}">
        Confirmamos tu reserva en el club.
    </p>

    <div class="reservation-info">
        <p><b th:text="#{email.table.user.table(${tableNumber})}">Mesa: 0</b></p>
        <p><b th:text="#{email.table.user.capacity(${capacity})}">Capacidad: 0</b></p>
        <p><b th:text="#{email.table.user.date(${date})}">Fecha: 2025-01-01</b></p>
        <p><b th:text="#{email.table.user.time(${from}, ${to})}">Horario: 23:59 - 06:00</b></p>
    </div>

    <p style="text-align: center;">
        <a th:href="${ctaUrl}" class="button" th:text="#{email.booking.confirmed.user.cta}">
            Ver reserva
        </a>
    </p>

    <hr class="divider"/>

    <p th:text="#{email.booking.confirmed.user.instructions}">
        Recordá presentarte con tu documento y este email al ingresar.
    </p>
</div>
</body>
</html>
