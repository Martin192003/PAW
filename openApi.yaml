openapi: 3.0.3
info:
  title: PAW Webapp API
  version: 3.0.0

servers:
  - url: http://localhost:8080/webapp/api

tags:
  - name: API
  - name: Users
  - name: Clubs
  - name: Events
  - name: Products
  - name: Tables

paths:

  /:
    get:
      tags: [API]
      summary: API entry point
      responses:
        '200':
          description: API root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndexDto'

  /users:
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
      responses:
        '201':
          description: User created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [Users]
      summary: Get user by id
      responses:
        '200':
          description: User found
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Last-Modified:
              $ref: '#/components/headers/LastModifiedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Partially update user
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequestDto'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete user
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs:
    get:
      tags: [Clubs]
      summary: List clubs
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: zone
          in: query
          schema:
            $ref: '#/components/schemas/Zone'
        - name: genre
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
        - name: isBar
          in: query
          schema:
            type: boolean
        - name: availableToday
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated clubs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedClubResponseDto'
    post:
      tags: [Clubs]
      summary: Create club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequestDto'
      responses:
        '201':
          description: Club created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized

  /clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Clubs]
      summary: Get club by id
      responses:
        '200':
          description: Club found
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Last-Modified:
              $ref: '#/components/headers/LastModifiedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clubs]
      summary: Partially update club
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ClubUpdateRequestDto'
      responses:
        '200':
          description: Club updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/cover:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Clubs]
      summary: Get club cover image
      responses:
        '200':
          description: Binary image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/layout:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Clubs]
      summary: Get club layout metadata
      responses:
        '200':
          description: Layout metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDto'
        '204':
          description: Club has no layout
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/layout/image:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Clubs]
      summary: Get club layout image
      responses:
        '200':
          description: Binary image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/capacity:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Clubs]
      summary: Get club capacity policy
      responses:
        '200':
          description: Capacity policy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubLimitsDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /events:
    get:
      tags: [Events]
      summary: List events
      parameters:
        - name: clubId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: upcoming
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPagedResponseDto'

  /clubs/{clubId}/events:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Events]
      summary: List events by club
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated club events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPagedResponseDto'
    post:
      tags: [Events]
      summary: Create event under a club collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequestDto'
      responses:
        '201':
          description: Event created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventIdParam'
    get:
      tags: [Events]
      summary: Get event by id
      responses:
        '200':
          description: Event found
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
            Last-Modified:
              $ref: '#/components/headers/LastModifiedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events]
      summary: Partially update event
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequestDto'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events]
      summary: Delete event
      responses:
        '204':
          description: Event deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/photo:
    parameters:
      - $ref: '#/components/parameters/EventIdParam'
    get:
      tags: [Events]
      summary: Get event photo
      responses:
        '200':
          description: Binary image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Create or replace event photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
        '204':
          description: Photo replaced
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events]
      summary: Delete event photo
      responses:
        '204':
          description: Photo deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/products:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Products]
      summary: List products by club
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequestDto'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductIdParam'
    get:
      tags: [Products]
      summary: Get product by id
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      summary: Partially update product
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequestDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete product
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/tables:
    parameters:
      - $ref: '#/components/parameters/ClubIdParam'
    get:
      tags: [Tables]
      summary: List tables by club
      responses:
        '200':
          description: Table list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableDto'
    post:
      tags: [Tables]
      summary: Create table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreateRequestDto'
      responses:
        '201':
          description: Table created
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'

  /tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableIdParam'
    get:
      tags: [Tables]
      summary: Get table by id
      responses:
        '200':
          description: Table found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tables]
      summary: Partially update table
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TableUpdateRequestDto'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tables]
      summary: Delete table
      responses:
        '204':
          description: Table deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  headers:
    LocationHeader:
      description: Canonical URI of the created resource
      schema:
        type: string
        format: uri
    ETagHeader:
      description: Entity tag for conditional requests
      schema:
        type: string
    LastModifiedHeader:
      description: Resource last modification date
      schema:
        type: string

  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClubIdParam:
      name: clubId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventIdParam:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TableIdParam:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'

  schemas:
    ErrorDto:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LinkDto:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
          example: self
        href:
          type: string
          format: uri

    ApiIndexDto:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    UserDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        cellphone:
          type: string
        role:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        locale:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    ClubDto:
      type: object
      properties:
        clubId:
          type: string
          format: uuid
        clubName:
          type: string
        description:
          type: string
        location:
          type: string
        zone:
          $ref: '#/components/schemas/Zone'
        musicGenre:
          $ref: '#/components/schemas/MusicalGenre'
        priceRange:
          $ref: '#/components/schemas/Price'
        isBar:
          type: boolean
        rating:
          type: number
          format: float
        quantityRatings:
          type: integer
        createdAt:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    EventDto:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    ProductDto:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        description:
          type: string
        basePrice:
          type: number
          format: double
        productType:
          $ref: '#/components/schemas/ProductType'
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    TableDto:
      type: object
      properties:
        tableId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        tableNumber:
          type: integer
        capacity:
          type: integer
        tableState:
          $ref: '#/components/schemas/TableState'
        price:
          type: number
          format: double
        discount:
          type: number
          format: double
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    PagedClubResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClubDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    EventPagedResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    Zone:
      type: string
      enum: [ZONA_NORTE, ZONA_OESTE, ZONA_SUR, ZONA_CABA]

    Price:
      type: string
      enum: [BAJO, MEDIO, ALTO]

    MusicalGenre:
      type: string
      enum: [ROCK, POP, CACHENGUE, TECHNO, REGGAETON, CUMBIA, TRAP, JAZZ, ELECTRONICA, AFROBEAT, OTRO]

    ProductType:
      type: string
      enum: [ALCOHOLICA, NO_ALCOHOLICA, TRAGOS]

    TableState:
      type: string
      enum: [DISPONIBLE, RESERVADA, PENDIENTE]