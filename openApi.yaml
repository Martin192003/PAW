openapi: 3.0.3
info:
  title: BlingBling Clubs API
  version: 1.0.0
  description: |
    API BLingBling para autenticación, creación de usuarios y gestión básica de clubs.
servers:
  - url: http://localhost:8080
    description: Entorno local
  - url: https://pawserver.it.itba.edu.ar/paw-2025b-06/
    description: Entorno de producción

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID

  schemas:
    UUID:
      type: string
      format: uuid

    Price:
      type: string
      enum: [BAJO, MEDIO, ALTO]

    Zone:
      type: string
      enum: [ZONA_NORTE, ZONA_OESTE, ZONA_SUR, ZONA_CABA]

    MusicalGenre:
      type: string
      enum: [ROCK, POP, CACHENGUE, TECHNO, REGGAETON, CUMBIA, TRAP, JAZZ, ELECTRONICA, AFROBEAT, OTRO]

    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        username: { type: string }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        cellphone: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        verified: { type: boolean }
        locale: { type: string }
      required: [id, username, email, role]

    Club:
      type: object
      properties:
        clubId: { $ref: '#/components/schemas/UUID' }
        clubName: { type: string }
        description: { type: string }
        location: { type: string }
        zone: { $ref: '#/components/schemas/Zone' }
        musicGenre: { $ref: '#/components/schemas/MusicalGenre' }
        priceRange: { $ref: '#/components/schemas/Price' }
        isBar: { type: boolean }
        cbu: { type: string }
        rating: { type: number, format: float }
        quantityRatings: { type: integer }
        createdAt: { type: string, format: date-time }
        contactInfo:
          $ref: '#/components/schemas/User'
      required: [clubId, clubName, location, zone, musicGenre, priceRange, isBar]

    RegisterRequest:
      type: object
      required: [username, name, surname, email, password, passwordRepeat, cellphone]
      properties:
        username: { type: string }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        passwordRepeat: { type: string, format: password }
        cellphone: { type: string }
        locale: { type: string }

    LoginRequest:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail: { type: string }
        password: { type: string, format: password }
        rememberMe: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [newPassword, confirmPassword]
      properties:
        newPassword: { type: string, format: password, minLength: 6, maxLength: 100 }
        confirmPassword: { type: string, format: password, minLength: 6, maxLength: 100 }

    ResendVerificationRequest:
      type: object
      required: [usernameOrEmail]
      properties:
        usernameOrEmail: { type: string }

    UsernameUpdateRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }

    NameUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    SurnameUpdateRequest:
      type: object
      required: [surname]
      properties:
        surname: { type: string }

    CellphoneUpdateRequest:
      type: object
      required: [cellphone]
      properties:
        cellphone: { type: string }

    EmailUpdateRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ClubCreateRequest:
      type: object
      required: [clubName, location, priceRange, description, musicGenre, zone, isBar, cbu]
      properties:
        clubName: { type: string }
        location: { type: string }
        priceRange: { $ref: '#/components/schemas/Price' }
        description: { type: string }
        musicGenre: { $ref: '#/components/schemas/MusicalGenre' }
        zone: { $ref: '#/components/schemas/Zone' }
        isBar: { type: boolean }
        cbu: { type: string }
        imageUrl:
          type: string
          format: uri
          description: URL opcional de imagen de portada del club

    ProductCreateRequest:
      type: object
      required: [productName, description, basePrice, productType]
      properties:
        productName: { type: string, maxLength: 100 }
        description: { type: string }
        basePrice: { type: number, format: double, minimum: 0, maximum: 100000000 }
        productType: { $ref: '#/components/schemas/ProductType' }
        isAvailable: { type: boolean, default: true }

    ProductUpdateRequest:
      type: object
      required: [productName, description, basePrice, productType, isAvailable]
      properties:
        productName: { type: string, maxLength: 100 }
        description: { type: string }
        basePrice: { type: number, format: double, minimum: 0, maximum: 100000000 }
        productType: { $ref: '#/components/schemas/ProductType' }
        isAvailable: { type: boolean }

    TableCreateRequest:
      type: object
      required: [tableNumber, capacity, price]
      properties:
        tableNumber: { type: integer, minimum: 1, maximum: 9999 }
        capacity: { type: integer, minimum: 1, maximum: 9999 }
        price: { type: number, format: double, minimum: 0, maximum: 99999999.99 }
        discount: { type: number, format: double, minimum: 0, maximum: 100, default: 0 }
        tableState:
          $ref: '#/components/schemas/TableState'
          description: Estado inicial (default DISPONIBLE)

    TableUpdateRequest:
      type: object
      required: [tableNumber, capacity, price]
      properties:
        tableNumber: { type: integer, minimum: 1, maximum: 9999 }
        capacity: { type: integer, minimum: 1, maximum: 9999 }
        price: { type: number, format: double, minimum: 0, maximum: 99999999.99 }
        discount: { type: number, format: double, minimum: 0, maximum: 100, default: 0 }
        tableState:
          $ref: '#/components/schemas/TableState'
          description: Estado de la mesa (default DISPONIBLE)

    EventCreateRequest:
      type: object
      required: [eventName, description, date]
      properties:
        eventName: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        date: { type: string, format: date, description: "Debe ser futura" }

    EventUpdateRequest:
      type: object
      required: [eventName, description, date]
      properties:
        eventName: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        date: { type: string, format: date, description: "Debe ser futura" }

    ReviewCreateRequest:
      type: object
      required: [rating, description]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        description: { type: string, maxLength: 1000 }

    Event:
      type: object
      properties:
        eventId: { $ref: '#/components/schemas/UUID' }
        clubId: { $ref: '#/components/schemas/UUID' }
        eventName: { type: string }
        description: { type: string }
        date: { type: string, format: date }
        photoId: { $ref: '#/components/schemas/UUID' }
      required: [eventId, clubId, eventName, date]

    Review:
      type: object
      properties:
        reviewId: { $ref: '#/components/schemas/UUID' }
        user: { $ref: '#/components/schemas/User' }
        club: { $ref: '#/components/schemas/Club' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        fromTableGuest: { type: boolean }
        photoId: { $ref: '#/components/schemas/UUID' }
      required: [reviewId, user, club, rating, createdAt]

    TableState:
      type: string
      enum: [DISPONIBLE, RESERVADA, PENDIENTE]

    ClubTable:
      type: object
      properties:
        tableId: { $ref: '#/components/schemas/UUID' }
        clubId: { $ref: '#/components/schemas/UUID' }
        tableNumber: { type: integer }
        capacity: { type: integer }
        tableState: { $ref: '#/components/schemas/TableState' }
        price: { type: number, format: double }
        discount: { type: number, format: double, description: "Porcentaje 0-100" }
      required: [tableId, clubId, tableNumber, capacity, tableState, price, discount]

    ProductType:
      type: string
      enum: [ALCOHOLICA, NO_ALCOHOLICA, TRAGOS]

    Product:
      type: object
      properties:
        productId: { $ref: '#/components/schemas/UUID' }
        club: { $ref: '#/components/schemas/Club' }
        productName: { type: string }
        description: { type: string }
        basePrice: { type: number, format: double }
        productType: { $ref: '#/components/schemas/ProductType' }
        isAvailable: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [productId, club, productName, basePrice, productType, isAvailable]

    ClubLayout:
      type: object
      properties:
        layoutId: { $ref: '#/components/schemas/UUID' }
        clubId: { $ref: '#/components/schemas/UUID' }
        uploadedBy: { $ref: '#/components/schemas/UUID' }
        url: { type: string, format: uri }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
      required: [layoutId, clubId, uploadedBy, url, createdAt]

    CoverUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]

    UpcomingEventsResponse:
      type: object
      properties:
        eventsByClub:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Event'
          description: Map de clubId a lista de eventos
        clubsForEvents:
          type: array
          items:
            $ref: '#/components/schemas/Club'

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Autentica al usuario y devuelve sus datos básicos. Usa cookie de sesión (JSESSIONID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          headers:
            Set-Cookie:
              description: Cookie de sesión JSESSIONID
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Usuario no verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario autenticado
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /register:
    post:
      tags: [Auth]
      summary: Crear usuario
      description: Registra un nuevo usuario en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos o usuario duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile:
    get:
      tags: [Users]
      summary: Ver perfil (vista HTML)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Página de perfil
          content:
            text/html:
              schema:
                type: string
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }
  /profile/edit:
    get:
      tags: [Users]
      summary: Ver página de edición de perfil (HTML)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Página de edición
          content:
            text/html:
              schema:
                type: string
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/username:
    post:
      tags: [Users]
      summary: Actualizar username
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernameUpdateRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/name:
    post:
      tags: [Users]
      summary: Actualizar nombre
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NameUpdateRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/surname:
    post:
      tags: [Users]
      summary: Actualizar apellido
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SurnameUpdateRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/cellphone:
    post:
      tags: [Users]
      summary: Actualizar celular
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CellphoneUpdateRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/email:
    post:
      tags: [Users]
      summary: Actualizar email
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailUpdateRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/edit/password:
    post:
      tags: [Users]
      summary: Cambiar contraseña
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '302':
          description: Redirige a /profile con mensaje de éxito o error
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /profile/resend-verification:
    post:
      tags: [Users]
      summary: Reenviar mail de verificación
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Página con resultado del reenvío
          content:
            text/html:
              schema: { type: string }
        '401':
          description: No autenticado
          content:
            text/html:
              schema: { type: string }

  /clubs:
    get:
      tags: [Clubs]
      summary: Listar clubs
      description: |
        Devuelve clubs filtrados y paginados. Envía metadatos de paginación y disponibilidad por headers.
      parameters:
        - in: query
          name: name
          schema: { type: string }
          description: Coincidencia parcial por nombre.
        - in: query
          name: zone
          schema: { $ref: '#/components/schemas/Zone' }
        - in: query
          name: genre
          schema: { type: string }
          description: Género musical (texto libre que coincide con `musicGenre`).
        - in: query
          name: price
          schema: { $ref: '#/components/schemas/Price' }
        - in: query
          name: isBar
          schema: { type: boolean }
        - in: query
          name: availableToday
          schema: { type: boolean }
          description: Si es true, usa el modo de disponibilidad y fecha actual.
        - in: query
          name: sort
          schema: { type: string }
          description: |
            Campo de ordenamiento (incluye variantes availability_d{0|1|2}_{asc|desc} para fechas).
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: Lista de clubs
          headers:
            X-Total-Results: { schema: { type: string } }
            X-Total-Pages: { schema: { type: string } }
            X-Page: { schema: { type: string } }
            X-Size: { schema: { type: string } }
            X-Available-Today: { schema: { type: string }, description: "true si se usó modo disponibilidad" }
            X-Invalid-Day: { schema: { type: string }, description: "true si la fecha de disponibilidad es inválida" }
            X-Selected-Availability-Date: { schema: { type: string }, description: "Fecha evaluada (yyyy-MM-dd) cuando corresponde" }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Club'
    post:
      tags: [Clubs]
      summary: Crear un club
      description: Crea un nuevo club asociado al usuario autenticado (admin del club).
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequest'
      responses:
        '201':
          description: Club creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clubs/{clubId}:
    get:
      tags: [Clubs]
      summary: Obtener detalle de un club
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Datos del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '404':
          description: Club no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Clubs]
      summary: Actualizar club
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequest'
      responses:
        '200':
          description: Club actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '404':
          description: Club no encontrado

    #es para probar el delete, no sé si va a quedar así
    delete:
      tags: [ Clubs ]
      summary: Eliminar club
      security: [ { cookieAuth: [ ] } ]
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Club eliminado exitosamente
        '401':
          description: No autenticado
        '403':
          description: No autorizado (no eres el admin del club)
        '404':
          description: Club no encontrado
        '500':
          description: Error interno del servidor

  /clubs/{clubId}/cover:
    get:
      tags: [Clubs]
      summary: Obtener portada del club
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: URL de la portada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverUrl'
        '404':
          description: No hay portada cargada

  /clubs/{clubId}/events:
    get:
      tags: [Events]
      summary: Eventos de un club
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, past, future]
          default: all
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: Lista de eventos del club
          headers:
            X-Page: { schema: { type: string } }
            X-Size: { schema: { type: string } }
            X-Total-Pages: { schema: { type: string } }
            X-Filter: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      tags: [Events]
      summary: Crear evento para un club
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Evento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /clubs/{clubId}/events/{eventId}:
    put:
      tags: [Events]
      summary: Actualizar un evento de un club
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - in: path
          name: eventId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Evento o club no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clubs/{clubId}/layout:
    get:
      tags: [Clubs]
      summary: Obtener layout del club
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Layout del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubLayout'
        '404':
          description: Layout no encontrado

  /clubs/{clubId}/layout/image:
    get:
      tags: [Clubs]
