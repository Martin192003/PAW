  /clubs/{clubId}/limits:
    get:
      tags: [Clubs]
      summary: Flags de límites de productos y mesas
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Flags retornados vía headers
          headers:
            X-Max-Products-Reached: { schema: { type: string } }
            X-Max-Tables-Reached: { schema: { type: string } }

  /clubs/{clubId}/reviews:
    get:
      tags: [Reviews]
      summary: Reseñas de un club
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: Lista paginada de reseñas
          headers:
            X-Page: { schema: { type: string } }
            X-Size: { schema: { type: string } }
            X-Total-Pages: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags: [Reviews]
      summary: Crear reseña
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                description: { type: string, maxLength: 1000 }
                photo:
                  type: string
                  format: binary
              required: [rating, description]
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Reseña creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: No autorizado

  /clubs/events/upcoming:
    get:
      tags: [Events]
      summary: Próximos eventos agrupados por club
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, default: 30 }
      responses:
        '200':
          description: Eventos agrupados por club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingEventsResponse'
