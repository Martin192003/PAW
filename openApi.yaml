openapi: 3.0.3
info:
  title: PAW TPE API
  version: 2026.06.01
  description: >
    Contrato REST de la API actual. Las colecciones simples devuelven arrays.
    Las colecciones paginadas usadas por el frontend conservan wrapper con
    content/page/size/totalElements/totalPages y tambien exponen Link y
    X-Total-Count cuando el recurso lo implementa.
servers:
  - url: http://localhost:8080/webapp/api
security:
  - bearerAuth: []

tags:
  - name: Users
  - name: Clubs
  - name: Events
  - name: Photos
  - name: Menu
  - name: Tables
  - name: Reviews
  - name: Bookings

paths:
  /users:
    post:
      tags: [Users]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
      responses:
        '201':
          description: User created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated user
      responses:
        '200':
          description: Authenticated user with HATEOAS links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user
      responses:
        '200':
          description: User. Own user returns private fields, other users return public fields.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserDto'
                  - $ref: '#/components/schemas/PublicUserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update own user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
      responses:
        '200':
          description: User updated. A replacement bearer token is returned in the response body when profile fields used in authentication may have changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/profile:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update own user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestDto'
      responses:
        '200':
          description: Profile updated. A replacement bearer token is returned in the response body when profile fields used in authentication may have changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/reviews:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Reviews]
      summary: List reviews by user
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Array of reviews
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewDto'

  /users/verifications:
    get:
      tags: [Users]
      summary: Verify account from email link
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account verified. Returns a bearer token so the user can continue authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Users]
      summary: Verify account from code or token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVerificationRequestDto'
      responses:
        '200':
          description: Account verified. Returns a bearer token so the user can continue authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/verification-requests:
    post:
      tags: [Users]
      summary: Resend verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequestDto'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/password-reset-requests:
    post:
      tags: [Users]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestDto'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/password-resets:
    post:
      tags: [Users]
      summary: Reset password with token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetDto'
      responses:
        '200':
          description: Password changed. Returns a bearer token so the user can continue authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs:
    get:
      tags: [Clubs]
      summary: List clubs
      description: Supports owner filtering used by UserDto.links.clubs.
      parameters:
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
        - name: zone
          in: query
          schema:
            $ref: '#/components/schemas/Zone'
        - name: genre
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
        - name: isBar
          in: query
          schema:
            type: boolean
        - name: availableToday
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageOne'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated clubs
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubPagedResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Clubs]
      summary: Create club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequestDto'
      responses:
        '201':
          description: Club created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get club
      responses:
        '200':
          description: Club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clubs]
      summary: Update club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreateRequestDto'
      responses:
        '200':
          description: Club updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/{clubId}/limits:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get booking limits for club
      responses:
        '200':
          description: Club limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubLimitsDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/cover:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: Get club cover image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Photos]
      summary: Replace club cover image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '204':
          description: Cover replaced
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/{clubId}/layout:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get club layout metadata
      responses:
        '200':
          description: Layout metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clubs]
      summary: Replace club layout image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '204':
          description: Layout replaced

  /clubs/{clubId}/layout/image:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: Get club layout image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '204':
          description: Layout image does not exist

  /clubs/{clubId}/photos:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: List club gallery photos
      responses:
        '200':
          description: Photo DTO array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDto'
    post:
      tags: [Photos]
      summary: Upload club gallery photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDto'

  /clubs/{clubId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/PhotoId'
    delete:
      tags: [Photos]
      summary: Delete club gallery photo
      responses:
        '204':
          description: Photo deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/review-photos:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: List review photos for club
      responses:
        '200':
          description: Photo DTO array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDto'

  /photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [Photos]
      summary: Get photo image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/events:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Events]
      summary: List events by club
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Event array
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventDto'
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDto'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'

  /clubs/{clubId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get event in club
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Update event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDto'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
    delete:
      tags: [Events]
      summary: Delete event
      responses:
        '204':
          description: Event deleted

  /clubs/{clubId}/events/{eventId}/photo:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Photos]
      summary: Get event photo
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
    put:
      tags: [Photos]
      summary: Replace event photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: Event with photo link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
    delete:
      tags: [Photos]
      summary: Delete event photo
      responses:
        '200':
          description: Event after photo deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'

  /clubs/{clubId}/menu:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Menu]
      summary: List products by club
      responses:
        '200':
          description: Product array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
    post:
      tags: [Menu]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequestDto'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'

  /clubs/{clubId}/menu/{productId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Menu]
      summary: Get product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Menu]
      summary: Update product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequestDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'

  /clubs/{clubId}/tables:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Tables]
      summary: List club tables
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Table array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableDto'
    post:
      tags: [Tables]
      summary: Create table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableCreateRequestDto'
      responses:
        '201':
          description: Table created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'

  /clubs/{clubId}/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Tables]
      summary: Get table
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
    put:
      tags: [Tables]
      summary: Update table, including tableState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableUpdateRequestDto'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
    delete:
      tags: [Tables]
      summary: Delete table
      responses:
        '204':
          description: Table deleted

  /clubs/{clubId}/reviews:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Reviews]
      summary: List reviews by club
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Review array
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewDto'
    post:
      tags: [Reviews]
      summary: Create current user's review for club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequestDto'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [Reviews]
      summary: Update current user's review for club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequestDto'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
    delete:
      tags: [Reviews]
      summary: Delete current user's review for club
      responses:
        '204':
          description: Review deleted

  /clubs/{clubId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reviews]
      summary: Get review by id in club
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/bookings:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [Bookings]
      summary: Create booking for club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequestDto'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'

  /clubs/{clubId}/bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get own booking in club
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
    delete:
      tags: [Bookings]
      summary: Cancel own booking in club
      responses:
        '204':
          description: Booking cancelled

  /clubs/{clubId}/bookings/{bookingId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get booking receipt image
      responses:
        '200':
          description: Receipt image
          content:
            image/*:
              schema:
                type: string
                format: binary
    put:
      tags: [Bookings]
      summary: Upload or replace booking receipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: Receipt replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
        '201':
          description: Receipt uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
    delete:
      tags: [Bookings]
      summary: Delete booking receipt
      responses:
        '204':
          description: Receipt deleted

  /bookings:
    get:
      tags: [Bookings]
      summary: List authenticated user's bookings
      parameters:
        - $ref: '#/components/parameters/ClubIdQuery'
        - $ref: '#/components/parameters/BookingIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/BookingDateQuery'
        - $ref: '#/components/parameters/HasReceiptQuery'
        - $ref: '#/components/parameters/PageOne'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageDto'

  /managed-club-bookings:
    get:
      tags: [Bookings]
      summary: List bookings for clubs managed by authenticated user
      parameters:
        - $ref: '#/components/parameters/ClubIdQuery'
        - $ref: '#/components/parameters/BookingIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/BookingDateQuery'
        - $ref: '#/components/parameters/HasReceiptQuery'
        - $ref: '#/components/parameters/PageOne'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageDto'

  /managed-club-bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get booking from managed club
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
    put:
      tags: [Bookings]
      summary: Update managed booking status
      description: Accepts status CONFIRMADA or CANCELADA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
    delete:
      tags: [Bookings]
      summary: Cancel booking from managed club
      responses:
        '204':
          description: Booking cancelled

