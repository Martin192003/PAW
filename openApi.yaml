openapi: 3.0.3
info:
  title: PAW TPE API
  version: 2026.07.21
  description: >
    Contrato REST de la API actual. Las colecciones principales devuelven
    links a recursos individuales y exponen la paginacion por headers HTTP
    Link y X-Total-Count. Las representaciones completas se obtienen desde
    las URIs canonicas de detalle.
servers:
  - url: http://localhost:8080/webapp/api
security:
  - bearerAuth: []
  - basicAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Clubs
  - name: Events
  - name: Photos
  - name: Menu
  - name: Tables
  - name: Reviews
  - name: Bookings

paths:
  /:
    get:
      tags: [Root]
      summary: Discover API entry points
      security: []
      responses:
        '200':
          description: Links to root API collections and authentication resources.
          content:
            application/vnd.paw.api-root.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'

  /users:
    post:
      tags: [Users]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '201':
          description: User created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}/verification:
    put:
      tags: [Users]
      summary: Verify user email
      description: >
        Confirms the account by transitioning the user's verified state. The
        emailed link carries the userId and the verification token; the token
        must belong to the user in the path. Authentication is metadata: sending
        Basic credentials against any protected resource returns fresh JWT
        headers (Paw-Auth-Token), so there is no /users/me nor a /login resource
        (the client reads the userId from the JWT `sub` claim and then requests
        the canonical /users/{userId}).
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequestDto'
      responses:
        '200':
          description: Account verified. A fresh bearer token is returned in body and headers so the client is auto-logged-in.
          headers:
            Paw-Auth-Token:
              schema:
                type: string
            Paw-Token-Type:
              schema:
                type: string
            Paw-Token-Expires-In:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/credentials/password:
    put:
      tags: [Users]
      summary: Reset password using a mail token
      description: >
        Deliberate authentication-layer exception, not a domain resource. The
        reset is a pre-identity flow: the user only holds an opaque one-time
        reset token (delivered as a code in the email body), so the caller cannot
        name a canonical /users/{userId} URN. The token itself identifies the
        user server-side. Kept out of the resource surface on purpose; see also
        POST /auth/challenges.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetDto'
      responses:
        '200':
          description: Password reset. A fresh bearer token is returned in body and headers.
          headers:
            Paw-Auth-Token:
              schema:
                type: string
            Paw-Token-Type:
              schema:
                type: string
            Paw-Token-Expires-In:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user
      responses:
        '200':
          description: User. Private fields are present only when the caller requests its own user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Partially update own user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '200':
          description: User updated. A replacement bearer token is returned in the response body when profile fields used in authentication may have changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/credentials/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Replace authenticated user's password credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetDto'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/reviews:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Reviews]
      summary: List reviews by user
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to reviews authored by the user.
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'

  /auth/challenges:
    post:
      tags: [Auth]
      summary: Create authentication challenge
      description: >
        Deliberate authentication-layer exception, not a domain resource. These
        are pre-identity triggers (resend verification email / request password
        reset) where the caller only supplies a username or email, not a
        canonical /users/{userId} URN, so the operation cannot be modelled as a
        user sub-resource. Sends a verification or password-reset email depending
        on challengeType. See also PUT /users/credentials/password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequestDto'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '204':
          description: Challenge accepted without response body
        '400':
          $ref: '#/components/responses/BadRequest'

  /clubs:
    get:
      tags: [Clubs]
      summary: List clubs
      description: Supports owner filtering used by UserDto.links.clubs.
      parameters:
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
        - name: zone
          in: query
          schema:
            $ref: '#/components/schemas/Zone'
        - name: genre
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
        - name: isBar
          in: query
          schema:
            type: boolean
        - name: availableToday
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to clubs. Pagination is represented by Link and X-Total-Count headers.
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Clubs]
      summary: Create club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubDto'
      responses:
        '201':
          description: Club created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get club
      parameters:
        - name: managed
          in: query
          description: Require the authenticated user to manage the club and include private management fields/links.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Clubs]
      summary: Partially update club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubDto'
      responses:
        '200':
          description: Club updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/{clubId}/limits:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get booking limits for club
      responses:
        '200':
          description: Club limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubLimitsDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/cover:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: Get club cover image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Photos]
      summary: Replace club cover image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '204':
          description: Cover replaced
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/{clubId}/layout:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Clubs]
      summary: Get club layout metadata
      responses:
        '200':
          description: Layout metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clubs]
      summary: Replace club layout image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '204':
          description: Layout replaced

  /clubs/{clubId}/layout/image:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: Get club layout image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '204':
          description: Layout image does not exist

  /clubs/{clubId}/photos:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: List club gallery photos
      responses:
        '200':
          description: Photo DTO array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDto'
    post:
      tags: [Photos]
      summary: Upload club gallery photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDto'

  /clubs/{clubId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/PhotoId'
    delete:
      tags: [Photos]
      summary: Delete club gallery photo
      responses:
        '204':
          description: Photo deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/review-photos:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Photos]
      summary: List review photos for club
      responses:
        '200':
          description: Photo DTO array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDto'

  /photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [Photos]
      summary: Get photo image
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/events:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Events]
      summary: List events by club
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to events in the club.
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDto'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'

  /clubs/{clubId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get event in club
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events]
      summary: Update event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDto'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
    delete:
      tags: [Events]
      summary: Delete event
      responses:
        '204':
          description: Event deleted

  /events:
    get:
      tags: [Events]
      summary: List upcoming events
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to upcoming events.
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'

  /clubs/{clubId}/events/{eventId}/photo:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Photos]
      summary: Get event photo
      responses:
        '200':
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
    put:
      tags: [Photos]
      summary: Replace event photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: Event with photo link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
    delete:
      tags: [Photos]
      summary: Delete event photo
      responses:
        '204':
          description: Event photo deleted

  /clubs/{clubId}/menu:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Menu]
      summary: List products by club
      responses:
        '200':
          description: Links to products in the club menu.
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
    post:
      tags: [Menu]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'

  /clubs/{clubId}/menu/{productId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Menu]
      summary: Get product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Menu]
      summary: Update product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'

  /clubs/{clubId}/tables:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Tables]
      summary: List club tables
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Links to club tables.
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
    post:
      tags: [Tables]
      summary: Create table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDto'
      responses:
        '201':
          description: Table created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'

  /clubs/{clubId}/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Tables]
      summary: Get table
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
    put:
      tags: [Tables]
      summary: Update table, including tableState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDto'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDto'
    delete:
      tags: [Tables]
      summary: Delete table
      responses:
        '204':
          description: Table deleted

  /clubs/{clubId}/reviews:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Reviews]
      summary: List reviews by club
      parameters:
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to reviews for the club.
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
    post:
      tags: [Reviews]
      summary: Create current user's review for club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewMultipartRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '409':
          $ref: '#/components/responses/Conflict'
  /clubs/{clubId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reviews]
      summary: Get review by id in club
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reviews]
      summary: Update authenticated user's review by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDto'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewMultipartRequest'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reviews]
      summary: Delete authenticated user's review by id
      responses:
        '204':
          description: Review deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/bookings:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [Bookings]
      summary: List bookings managed for a club
      parameters:
        - $ref: '#/components/parameters/BookingIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/BookingDateQuery'
        - $ref: '#/components/parameters/HasReceiptQuery'
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to private bookings managed by the authenticated club admin.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Vary:
              schema:
                type: string
              description: Authorization
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
    post:
      tags: [Bookings]
      summary: Create booking for club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDto'
      responses:
        '201':
          description: Booking created
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Canonical booking URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'

  /clubs/{clubId}/bookings/{bookingId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get booking receipt image
      responses:
        '200':
          description: Receipt image
          content:
            image/*:
              schema:
                type: string
                format: binary
    put:
      tags: [Bookings]
      summary: Upload or replace booking receipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: Receipt replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
        '201':
          description: Receipt uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
    delete:
      tags: [Bookings]
      summary: Delete booking receipt
      responses:
        '204':
          description: Receipt deleted

  /users/{userId}/bookings:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Bookings]
      summary: List bookings owned by the authenticated user
      parameters:
        - $ref: '#/components/parameters/ClubIdQuery'
        - $ref: '#/components/parameters/BookingIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/BookingDateQuery'
        - $ref: '#/components/parameters/HasReceiptQuery'
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to private bookings owned by the authenticated user.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Vary:
              schema:
                type: string
              description: Authorization
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'

  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings owned or managed by the authenticated user
      parameters:
        - name: managed
          in: query
          schema:
            type: boolean
            default: false
          description: false returns bookings owned by the authenticated user; true returns bookings managed by that user.
        - $ref: '#/components/parameters/ClubIdQuery'
        - $ref: '#/components/parameters/BookingIdQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/SortQuery'
        - $ref: '#/components/parameters/BookingDateQuery'
        - $ref: '#/components/parameters/HasReceiptQuery'
        - $ref: '#/components/parameters/PageZero'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Links to private bookings owned or managed by the authenticated user, according to the managed parameter.
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            Vary:
              schema:
                type: string
              description: Authorization
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/vnd.paw.link-collection.v1+json:
              schema:
                $ref: '#/components/schemas/LinkCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCollection'

  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get booking by canonical id
      description: Returns the booking when the authenticated user is the owner or manages its club. With managed=true, the user must manage the booking's club.
      parameters:
        - name: managed
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Bookings]
      summary: Update managed booking status
      description: Accepts status CONFIRMADA or CANCELADA when the authenticated user manages the booking's club.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDto'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Bookings]
      summary: Cancel booking by canonical id
      description: Cancels the booking when the authenticated user is the owner or manages its club.
      responses:
        '204':
          description: Booking cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClubId:
      name: clubId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageZero:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
    ClubIdQuery:
      name: clubId
      in: query
      schema:
        type: string
        format: uuid
    BookingIdQuery:
      name: bookingId
      in: query
      schema:
        type: string
        format: uuid
    StatusQuery:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/Status'
    SortQuery:
      name: sort
      in: query
      schema:
        type: string
    BookingDateQuery:
      name: bookingDate
      in: query
      schema:
        type: string
        format: date
    HasReceiptQuery:
      name: hasReceipt
      in: query
      schema:
        type: boolean

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Message:
      description: Message response
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

  schemas:
    LinkDto:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
          format: uri
        method:
          type: string

    LinkCollection:
      type: array
      items:
        $ref: '#/components/schemas/LinkDto'

    ErrorDto:
      type: object
      properties:
        message:
          type: string

    UserDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
          description: Present only in the authenticated user's private representation.
        password:
          type: string
          writeOnly: true
          description: Accepted only on registration.
        cellphone:
          type: string
          description: Present only in the authenticated user's private representation.
        role:
          type: string
          readOnly: true
        verified:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        locale:
          type: string
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'

    UserUpdateResponseDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        accessToken:
          type: string
          description: Replacement bearer token for subsequent requests.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.

    AuthChallengeRequestDto:
      type: object
      required: [challengeType]
      properties:
        challengeType:
          type: string
          enum: [email_verification, password_reset]
        usernameOrEmail:
          type: string
          description: Required for email_verification.
        email:
          type: string
          format: email
          description: Required for password_reset.

    VerificationRequestDto:
      type: object
      properties:
        token:
          type: string
          description: Verification token received by mail.
        code:
          type: string
          description: Verification code received by mail.

    PasswordResetDto:
      type: object
      properties:
        token:
          type: string
          description: Required for unauthenticated password reset.
        newPassword:
          type: string
        confirmationPassword:
          type: string

    ClubDto:
      type: object
      properties:
        clubId:
          type: string
          format: uuid
          readOnly: true
        clubName:
          type: string
        description:
          type: string
        location:
          type: string
        zone:
          type: string
        musicGenre:
          type: string
        priceRange:
          type: string
        bar:
          type: boolean
        cbu:
          type: string
          nullable: true
          description: Required on create/update. Returned only on owner-authenticated club responses; omitted or null in public club representations.
        rating:
          type: number
          format: float
          readOnly: true
        quantityRatings:
          type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'

    ClubLimitsDto:
      type: object
      properties:
        clubId:
          type: string
        maxCapacity:
          type: integer
        maxTables:
          type: integer
        minTables:
          type: integer
        maxBookingDays:
          type: integer

    LayoutDto:
      type: object
      properties:
        clubId:
          type: string
        imageUrl:
          type: string

    PhotoDto:
      type: object
      properties:
        photoId:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        url:
          type: string
        contentType:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    EventDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventName:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        photoId:
          type: string
          format: uuid
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    ProductDto:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          readOnly: true
        productName:
          type: string
        description:
          type: string
        basePrice:
          type: number
        productType:
          $ref: '#/components/schemas/ProductType'
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'

    TableDto:
      type: object
      properties:
        tableId:
          type: string
          format: uuid
          readOnly: true
        clubId:
          type: string
          format: uuid
          readOnly: true
        tableNumber:
          type: integer
        capacity:
          type: integer
        tableState:
          $ref: '#/components/schemas/TableState'
        price:
          type: number
        discount:
          type: number
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'


    ReviewDto:
      type: object
      properties:
        reviewId:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
        clubId:
          type: string
          format: uuid
          readOnly: true
        rating:
          type: integer
        description:
          type: string
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'

    ReviewMultipartRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        description:
          type: string
        file:
          type: string
          format: binary

    BookingDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          writeOnly: true
          description: Accepted on booking creation.
        bookingStart:
          type: string
          format: date-time
          readOnly: true
        bookingEnd:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        totalAmount:
          type: number
          readOnly: true
        hasReceipt:
          type: boolean
          readOnly: true
        links:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LinkDto'

    ReceiptDto:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkDto'

    FileUpload:
      type: object
      properties:
        file:
          type: string
          format: binary

    Status:
      type: string
      enum: [PENDIENTE, DISPONIBLE, CONFIRMADA, CANCELADA]

    TableState:
      type: string
      enum: [DISPONIBLE, RESERVADA, PENDIENTE]

    ProductType:
      type: string
      enum: [ALCOHOLICA, NO_ALCOHOLICA, TRAGOS]

    Zone:
      type: string
      enum: [ZONA_NORTE, ZONA_OESTE, ZONA_SUR, ZONA_CABA]
